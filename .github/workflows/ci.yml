name: CI

# Reproduit les validations obligatoires de AGENTS.md section 14.
# Les tests Playwright d'accessibilite restent volontairement locaux : ils exigent le
# telechargement d'un navigateur de plus de 100 Mio.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # La CLI Angular 22 exige Node 22.22.3, 24.15.0 ou plus recent.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  backend:
    name: Backend (tests, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Docker est disponible sur les agents heberges : Testcontainers demarre
      # postgres:18 sans service declare.
      - run: ./mvnw --batch-mode test
