spring:
  application:
    name: routes-oubliees
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/routes_oubliees}
    username: ${DATABASE_USERNAME:routes_oubliees}
    password: ${DATABASE_PASSWORD:routes_oubliees_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # Refus explicite des proprietes JSON inconnues : la stricte lecture des DTO
      # ne doit pas dependre d'un defaut de la bibliotheque ou du demarreur.
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      # Contrat d'erreur unique en application/problem+json (RFC 9457), comme le point
      # d'entree 401. Les refus metier exposent alors leur motif, aujourd'hui perdu.
      enabled: true
  task:
    scheduling:
      # Le defaut est un thread unique, partage par le heartbeat et le balayage des
      # presences Radar : une tache lente y suspendrait les autres.
      pool:
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  # Adresse d'ecoute configurable : voir docs/DEPLOIEMENT.md.
  # Deploiement systemd sur l'hote : SERVER_ADDRESS=127.0.0.1.
  # Deploiement en conteneur : 0.0.0.0 dans le conteneur, publication limitee au loopback de l'hote.
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: framework

routes-oubliees:
  media-storage-path: ${MEDIA_STORAGE_PATH:./media}
  media-max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:5242880}
  quest-document-max-upload-bytes: ${QUEST_DOCUMENT_MAX_UPLOAD_BYTES:9437184}
  public-url: ${SITE_PUBLIC_URL:http://localhost:4200}
  timezone: ${SITE_TIMEZONE:Europe/Paris}
  admin-bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:admin@example.invalid}
  cloudflare-access:
    issuer: ${CF_ACCESS_ISSUER:https://example.cloudflareaccess.com}
    audience: ${CF_ACCESS_AUDIENCE:example-audience-tag}
    certs-url: ${CF_ACCESS_CERTS_URL:https://example.cloudflareaccess.com/cdn-cgi/access/certs}
  radar:
    home-assistant:
      # Aucun secret de secours : un token vide fait echouer toute authentification
      # Home Assistant. Le profil prod exige explicitement la variable d'environnement.
      token: ${RADAR_HOME_ASSISTANT_TOKEN:}
