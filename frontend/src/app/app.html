@let showInstallPrompt = pwaPrompt.canInstall() || pwaPrompt.showIosHelp();

<a class="skip-link" href="#main-content">Aller au contenu principal</a>

<!--
  L'expiration est portée visuellement par l'en-tête, qui remplace le menu de profil par un lien
  de reprise. Un changement d'en-tête n'étant annoncé par aucun lecteur d'écran, cette région
  s'en charge. Elle est toujours présente et vide : une région créée au moment où elle se remplit
  n'est pas annoncée.
-->
<p class="sr-only" role="status">
  @if (accessSession.sessionExpired()) {
    Votre session sécurisée a expiré. La reprise se fait depuis l'en-tête, dès que le réseau est
    disponible.
  }
</p>

<app-public-header />

<div class="app-shell">
  <aside class="sidebar" aria-labelledby="primary-navigation-title">
    <h2 id="primary-navigation-title">Navigation</h2>
    <app-desktop-navigation labelledBy="primary-navigation-title" />
  </aside>

  <main id="main-content" tabindex="-1" [class.has-install-prompt]="showInstallPrompt">
    @if (isNavigating()) {
      <app-loading-indicator label="Chargement de la page." />
    }
    <router-outlet />
  </main>
</div>

<app-mobile-navigation />
<app-pwa-install-prompt />
<app-portal-identity-dialog />
