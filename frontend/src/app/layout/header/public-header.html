<header class="site-header">
  <a class="brand" routerLink="/" [attr.aria-label]="'Accueil - ' + settings().siteName">
    <img
      class="brand-mark"
      [src]="settings().logoPath || fallbackLogo"
      alt=""
      aria-hidden="true"
    />
    <span class="brand-copy">
      <span class="brand-title">{{ settings().siteName }}</span>
      @if (settings().subtitle) {
        <span class="brand-subtitle">{{ settings().subtitle }}</span>
      }
    </span>
  </a>

  <!--
    Panneau de divulgation et non modèle ARIA « menu » : deux actions au plus, donc du HTML
    natif (bouton, lien, bouton) plutôt qu'un modèle clavier complet à réimplémenter.
  -->
  <div class="profile-menu" #profileMenu>
    <button
      #profileButton
      type="button"
      class="profile-button"
      [attr.aria-expanded]="profileMenuOpen()"
      aria-controls="profile-panel"
      [attr.aria-label]="profileLabel()"
      (click)="toggleProfileMenu()"
    >
      <span class="profile-avatar" [class.guest]="portal.identity()?.accessMode === 'GUEST'">
        @if (portal.identity()?.avatarPath; as avatarPath) {
          <img [src]="avatarPath" alt="" />
        }
        @else if (portal.identity()?.accessMode === 'GUEST') {
          <span aria-hidden="true">?</span>
        }
        @else {
          <span aria-hidden="true">{{ profileInitials() }}</span>
        }
      </span>
      <span class="profile-name">{{ profileName() }}</span>
    </button>

    <!--
      Le panneau reste dans le document, masqué par `hidden` : `aria-controls` doit désigner
      un élément existant, y compris panneau fermé. `hidden` retire l'élément de l'ordre de
      tabulation et de l'arbre d'accessibilité.
    -->
    <div class="profile-panel" id="profile-panel" [hidden]="!profileMenuOpen()">
      @if (portal.canAccessAdmin()) {
        <a routerLink="/admin" (click)="closeProfileMenu()">Administration</a>
      }
      <button type="button" class="profile-logout" (click)="logout()">Se déconnecter</button>
    </div>
  </div>
</header>

@if (settings().status === 'MAINTENANCE') {
  <p class="maintenance-banner" role="status">
    {{ settings().maintenanceMessage || 'Le site est temporairement en maintenance.' }}
  </p>
}
