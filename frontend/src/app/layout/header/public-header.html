<header class="site-header">
  <a class="brand" routerLink="/" [attr.aria-label]="'Accueil - ' + settings().siteName">
    <img
      class="brand-mark"
      [src]="settings().logoPath || fallbackLogo"
      alt=""
      aria-hidden="true"
    />
    <span class="brand-copy">
      <span class="brand-title">{{ settings().siteName }}</span>
      @if (settings().subtitle) {
        <span class="brand-subtitle">{{ settings().subtitle }}</span>
      }
    </span>
  </a>

  <a class="admin-gate-link" routerLink="/admin/login" title="Accès admin">
    <span class="sr-only">Accès admin</span>
    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path
        d="M12 3l7 3v5c0 4.6-2.8 8.7-7 10-4.2-1.3-7-5.4-7-10V6l7-3z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
      <path
        d="M9 12c.5-1 1.5-1.6 3-1.6s2.5.6 3 1.6M8.5 15c1 1 2.2 1.5 3.5 1.5s2.5-.5 3.5-1.5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  </a>
</header>

@if (settings().status === 'MAINTENANCE') {
  <p class="maintenance-banner" role="status">
    {{ settings().maintenanceMessage || 'Le site est temporairement en maintenance.' }}
  </p>
}
