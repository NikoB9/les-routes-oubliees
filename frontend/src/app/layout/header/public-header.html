<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Accueil - Les Routes Oubliees">
    <img
      class="brand-mark"
      src="/assets/brand/logo-compagnie-des-routes-oubliees.png?v=12fa08d"
      alt=""
      aria-hidden="true"
    />
    <span class="brand-copy">
      <span class="brand-title">Les Routes Oubliées</span>
      <span class="brand-subtitle">Compagnie d'Arkhavel</span>
    </span>
  </a>

  <div class="admin-seal">
    <button
      type="button"
      class="admin-seal-trigger"
      aria-label="Reveler l'acces administrateur"
      title="Sceau des eclaireurs"
      (click)="revealAdminGate()"
    >
      <span aria-hidden="true">*</span>
    </button>

    @if (adminGateRevealed()) {
      <a class="admin-gate-link" routerLink="/admin/login">Passage des eclaireurs</a>
    }
  </div>
</header>
