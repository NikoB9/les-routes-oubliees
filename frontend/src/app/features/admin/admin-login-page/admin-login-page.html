<section class="page-intro" aria-labelledby="admin-login-title">
  <p class="eyebrow">Administration</p>
  <h1 id="admin-login-title">Connexion</h1>
  @if (accessDenied()) {
    <p class="alert" role="alert">Accès réservé aux éclaireurs autorisés.</p>
  }
  <p>Connecte-toi avec le compte Google autorisé pour accéder au tableau de bord.</p>
  <a class="login-link" href="/oauth2/authorization/google">Se connecter avec Google</a>
</section>
