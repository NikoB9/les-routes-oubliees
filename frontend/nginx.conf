server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Nginx n'herite les add_header du niveau superieur que si l'emplacement n'en declare
    # aucun : chaque emplacement posant son propre Cache-Control repete donc ces deux
    # en-tetes. La CSP et Permissions-Policy restent fournis par le reverse proxy de
    # production decrit dans infra/nginx/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resolveur DNS interne de Docker Compose : permet de resoudre le service
    # "backend" a chaque requete plutot qu'au demarrage, afin que nginx demarre
    # meme si le backend n'est pas encore pret (il repondra alors 502 en attendant).
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Proxy des appels applicatifs vers le backend Spring Boot (profil compose "app").
    # En production, ce role est tenu par le reverse proxy decrit dans infra/nginx/.
    location = /api/radar/events {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Publication de position Home Assistant : limite de corps restreinte a ce seul
    # emplacement (l'egalite exacte prime sur les emplacements par expression reguliere).
    location = /api/integrations/home-assistant/radar/treasure-position {
        client_max_body_size 4k;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Medias : seul chemin applicatif exempte de `no-store`, afin que le service worker
    # puisse les conserver pour le mode hors ligne. Aucun `Cache-Control` n'est pose ici,
    # `add_header` ajoutant sans remplacer celui du backend. Le prefixe `^~` prime sur
    # l'emplacement par expression reguliere qui suit.
    location ^~ /media/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Authorization $http_authorization;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # `/media/` est traite par l'emplacement precedent ; seul `/media` sans barre finale,
    # qui n'est associe a aucun controleur, parvient encore ici.
    location ~ ^/(api|media|actuator)(/|$) {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # `try_files` redirige ici en interne pour toutes les routes de la SPA : sans repetition,
    # le document HTML de chaque page partirait sans en-tete de securite.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
